apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: healthletic-backend

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: healthletic-backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: healthletic-backend

    spec:
      containers:
        - name: backend

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          env:
            - name: PORT
              value: "5000"

            - name: APP_VERSION
              value: "{{ .Values.app.version }}"

            - name: DATABASE_PATH
              value: "/tmp/healthletic.db"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}