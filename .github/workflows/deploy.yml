name: Healthletic CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/healthletic-backend

jobs:
  # ============================================================
  # BUILD + SECURITY SCAN + DOCKER HUB PUSH
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate semantic version
        id: version
        run: |
          VERSION="v1.0.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ steps.version.outputs.version }}" \
            .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          docker push "${IMAGE_NAME}:${VERSION}"

          docker tag \
            "${IMAGE_NAME}:${VERSION}" \
            "${IMAGE_NAME}:latest"

          docker push "${IMAGE_NAME}:latest"

  # ============================================================
  # KUBERNETES DEPLOYMENT
  # ============================================================
  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, windows, x64]

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      KUBECONFIG: C:\actions-runner\kubeconfig

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes access
        shell: cmd
        run: |
          echo Checking Kubernetes context...
          kubectl config current-context

          echo Checking Kubernetes nodes...
          kubectl get nodes

      - name: Verify Helm
        shell: cmd
        run: |
          echo Checking Helm...
          helm version

      - name: Validate Helm chart
        shell: cmd
        run: |
          echo Validating Helm chart...
          helm lint helm\backend

      - name: Generate deployment version
        shell: cmd
        run: |
          echo Deploying version v1.0.%GITHUB_RUN_NUMBER%

      - name: Deploy application with Helm
        shell: cmd
        run: |
          echo Deploying Healthletic backend...

          helm upgrade --install healthletic-backend helm\backend ^
            --namespace healthletic ^
            --create-namespace ^
            --set image.repository=%IMAGE_NAME% ^
            --set image.tag=v1.0.%GITHUB_RUN_NUMBER% ^
            --wait ^
            --atomic ^
            --timeout 5m

      - name: Verify deployment
        shell: cmd
        run: |
          echo ==============================
          echo DEPLOYMENT
          echo ==============================

          kubectl get deployment -n healthletic

          echo ==============================
          echo PODS
          echo ==============================

          kubectl get pods -n healthletic

          echo ==============================
          echo SERVICES
          echo ==============================

          kubectl get services -n healthletic

      - name: Check pod readiness
        shell: cmd
        run: |
          echo Waiting for backend deployment...

          kubectl rollout status deployment/healthletic-backend-backend ^
            --namespace healthletic ^
            --timeout=180s

          if errorlevel 1 (
            echo Backend deployment is not ready
            exit /b 1
          )

          echo Backend deployment is READY

      - name: Smoke test API
        shell: cmd
        run: |
          echo ==============================
          echo STARTING PORT FORWARD
          echo ==============================

          start "" /b cmd /c "kubectl port-forward service/healthletic-backend 18081:5000 -n healthletic > port-forward.log 2>&1"

          timeout /t 5 /nobreak

          echo ==============================
          echo PORT FORWARD LOG
          echo ==============================

          type port-forward.log

          echo ==============================
          echo API SMOKE TEST
          echo ==============================

          curl.exe --fail http://127.0.0.1:18081/health

          if errorlevel 1 (
            echo API smoke test FAILED
            taskkill /F /IM kubectl.exe >nul 2>&1
            exit /b 1
          )

          echo API smoke test PASSED

          taskkill /F /IM kubectl.exe >nul 2>&1
      - name: Smoke test database
        shell: cmd
        run: |
          echo ==============================
          echo DATABASE SMOKE TEST
          echo ==============================

          for /f "delims=" %%P in ('kubectl get pods -n healthletic -l app=healthletic-backend -o jsonpath="{.items[0].metadata.name}"') do set POD=%%P

          echo Testing database in pod: %POD%

          if "%POD%"=="" (
            echo No backend pod found
            exit /b 1
          )

          kubectl exec %POD% -n healthletic -- python -c "import sqlite3,os; db=os.getenv('DATABASE_PATH','healthletic.db'); c=sqlite3.connect(db); c.execute('SELECT 1'); c.close(); print('DATABASE OK')"

          if errorlevel 1 (
            echo DATABASE smoke test FAILED
            exit /b 1
          )

          echo DATABASE smoke test PASSED

      - name: Deployment verification
        shell: cmd
        run: |
          echo ==============================
          echo FINAL HELM STATUS
          echo ==============================

          helm status healthletic-backend -n healthletic

          echo ==============================
          echo FINAL POD STATUS
          echo ==============================

          kubectl get pods -n healthletic

      - name: Rollback on failure
        if: failure()
        shell: cmd
        run: |
          echo ========================================
          echo DEPLOYMENT OR SMOKE TEST FAILED
          echo STARTING HELM ROLLBACK
          echo ========================================

          helm rollback healthletic-backend 0 --namespace healthletic --wait --timeout 5m

          echo ========================================
          echo ROLLBACK COMPLETED
          echo ========================================

          helm status healthletic-backend --namespace healthletic

          kubectl get pods --namespace healthletic
