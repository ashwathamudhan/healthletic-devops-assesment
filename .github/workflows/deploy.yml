name: Healthletic CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/healthletic-backend

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate semantic version
        id: version
        run: |
          VERSION="v1.0.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ steps.version.outputs.version }}" \
            .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          docker push "${IMAGE_NAME}:${VERSION}"

          docker tag \
            "${IMAGE_NAME}:${VERSION}" \
            "${IMAGE_NAME}:latest"

          docker push "${IMAGE_NAME}:latest"cl

  runner-test:
    name: Test Windows Kubernetes Runner
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Check Docker
        shell: powershell
        run: docker --version

      - name: Check kubectl
        shell: powershell
        run: kubectl version --client

      - name: Check Helm
        shell: powershell
        run: helm version

      - name: Check Kubernetes
        shell: powershell
        run: kubectl get nodes
